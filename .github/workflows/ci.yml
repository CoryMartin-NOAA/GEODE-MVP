name: Earth System Pipeline CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' 
      - run: |
          python -m pip install --upgrade pip
          pip install confluent-kafka pandas pyarrow s3fs pytest flake8
      - run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - run: pytest
      - run: docker build -t earth-sys-worker:ci-test .
